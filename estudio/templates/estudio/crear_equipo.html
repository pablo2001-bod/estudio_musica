{% extends 'base.html' %}

{% block title %}Registrar Equipo{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <h3 class="fw-bold mb-4 text-center">Registrar Nuevo Equipo</h3>
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Equipo</label>
                        <input type="text" name="nombre" class="form-control rounded-3" placeholder="Ej. Shure SM58, Marshall JCM800" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Categoría</label>
                        <select name="categoria" class="form-select rounded-3" required>
                            <option value="Micrófono">Micrófono</option>
                            <option value="Amplificador">Amplificador</option>
                            <option value="Instrumento">Instrumento</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio de Alquiler ($)</label>
                        <input type="number" step="0.01" name="precio_alquiler" class="form-control rounded-3" placeholder="Ej. 5.00" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Fotografía</label>
                        <input type="file" id="imagen-eq" name="imagen" class="form-control rounded-3" accept=".png, .jpg, .jpeg" onchange="previewImagenEquipo(event)">
                        
                        <div class="mt-3 text-center d-none" id="preview-container-eq">
                            <p class="small text-muted mb-1">Vista previa:</p>
                            <img id="img-preview-eq" src="#" alt="Vista previa" class="img-fluid rounded-3 shadow-sm" style="max-height: 200px; object-fit: cover;">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{% url 'equipos' %}" class="btn btn-outline-secondary rounded-pill w-50">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill w-50">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function previewImagenEquipo(event) {
    const input = event.target;
    const container = document.getElementById('preview-container-eq');
    const preview = document.getElementById('img-preview-eq');
    const file = input.files[0];

    if (file) {
        const fileType = file.type;
        const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
        
        if (!validTypes.includes(fileType)) {
            alert('Solo se admiten archivos de imagen en formato PNG o JPG.');
            input.value = '';
            container.classList.add('d-none');
            return;
        }

        const reader = new FileReader();
        reader.onload = function() {
            preview.src = reader.result;
            container.classList.remove('d-none');
        }
        reader.readAsDataURL(file);
    } else {
        container.classList.add('d-none');
    }
}
</script>
{% endblock %}
