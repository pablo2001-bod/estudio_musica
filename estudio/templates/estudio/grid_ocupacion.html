{% extends 'base.html' %}
{% block title %}Grid de Ocupación{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Ocupación y Disponibilidad</h2>
    </div>

    <div class="card border-0 shadow rounded-4 p-4 bg-white">
        <div id="calendar"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        slotMinTime: '08:00:00',
        slotMaxTime: '23:00:00',
        events: '/api/reservas-eventos/',
        eventClick: function(info) {
            Swal.fire({
                title: info.event.title,
                text: `Reserva programada desde ${info.event.start.toLocaleString()} hasta ${info.event.end ? info.event.end.toLocaleString() : ''}`,
                icon: 'info',
                confirmButtonText: 'Entendido'
            });
        }
    });
    calendar.render();
});
</script>
{% endblock %}
