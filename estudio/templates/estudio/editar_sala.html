{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Sala - {{ sala.nombre }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">Editar Sala: {{ sala.nombre }}</h4>
                </div>

                <form method="POST" enctype="multipart/form-data" class="card-body p-4">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre de la Sala</label>
                        <input type="text" class="form-control rounded-3" id="nombre" name="nombre" value="{{ sala.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-bold">Descripción</label>
                        <textarea class="form-control rounded-3" id="descripcion" name="descripcion" rows="3">{{ sala.descripcion }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="precio_hora" class="form-label fw-bold">Precio por Hora</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-3">$</span>
                            <input type="number" step="0.01" class="form-control rounded-end-3" id="precio_hora" name="precio_hora" value="{{ sala.precio_hora }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="imagen" class="form-label fw-bold">Fotografía</label>
                        
                        <div class="mt-2 text-center {% if not sala.imagen %}d-none{% endif %}" id="preview-container">
                            <p class="small text-muted mb-1" id="preview-title">
                                {% if sala.imagen %}Imagen actual:{% else %}Vista previa:{% endif %}
                            </p>
                            <img id="img-preview" 
                                 src="{% if sala.imagen %}{{ sala.imagen.url }}{% else %}#{% endif %}" 
                                 alt="{{ sala.nombre }}" 
                                 class="img-fluid rounded-3 shadow-sm mb-2" 
                                 style="max-height: 200px; object-fit: cover;">
                        </div>

                        <input type="file" class="form-control rounded-3 mt-2" id="imagen" name="imagen" accept=".png, .jpg, .jpeg" onchange="previewImagen(event)">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                            Actualizar Sala
                        </button>
                        <a href="{% url 'salas' %}" class="btn btn-light rounded-pill text-muted">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function previewImagen(event) {
    const input = event.target;
    const container = document.getElementById('preview-container');
    const preview = document.getElementById('img-preview');
    const title = document.getElementById('preview-title');
    const file = input.files[0];

    if (file) {
        const fileType = file.type;
        const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
        
        if (!validTypes.includes(fileType)) {
            alert('Solo se admiten archivos de imagen en formato PNG o JPG.');
            input.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = function() {
            preview.src = reader.result;
            title.textContent = 'Nueva imagen seleccionada:';
            container.classList.remove('d-none');
        }
        reader.readAsDataURL(file);
    }
}
</script>
{% endblock %}
