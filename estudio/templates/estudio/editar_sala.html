{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Sala - {{ sala.nombre }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">Editar Sala: {{ sala.nombre }}</h4>
                </div>

                <form method="POST" enctype="multipart/form-data" class="card-body p-4">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre de la Sala</label>
                        <input type="text" class="form-control rounded-3" id="nombre" name="nombre" value="{{ sala.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-bold">Descripción</label>
                        <textarea class="form-control rounded-3" id="descripcion" name="descripcion" rows="3">{{ sala.descripcion }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="precio_hora" class="form-label fw-bold">Precio </label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-3">$</span>
                            <input type="number" step="0.01" class="form-control rounded-end-3" id="precio_hora" name="precio_hora" value="{{ sala.precio_hora }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="imagen" class="form-label fw-bold">Imagen</label>
                        
                        {% if sala.imagen %}
                            <div class="mb-2 text-center" id="actual-container">
                                <p class="small text-muted mb-1">Imagen actual:</p>
                                <img src="{{ sala.imagen.url }}" alt="{{ sala.nombre }}" class="img-fluid rounded-3 shadow-sm mb-2" style="max-height: 180px; object-fit: cover;">
                            </div>
                        {% endif %}

                        <input type="file" class="form-control rounded-3" id="imagen" name="imagen" accept="image/*" onchange="previewImagen(event)">
                        <small class="text-muted">Imagen actual.</small>
                        
                        <div class="mt-3 text-center d-none" id="preview-container">
                            <p class="small text-success fw-bold mb-1">Nueva imagen seleccionada:</p>
                            <img id="img-preview" src="#" alt="Vista previa" class="img-fluid rounded-3 shadow-sm" style="max-height: 200px; object-fit: cover;">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                            Actualizar Sala
                        </button>
                        <a href="{% url 'salas' %}" class="btn btn-light rounded-pill text-muted">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function previewImagen(event) {
    const reader = new FileReader();
    const container = document.getElementById('preview-container');
    const preview = document.getElementById('img-preview');

    reader.onload = function() {
        preview.src = reader.result;
        container.classList.remove('d-none');
    }

    if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    } else {
        container.classList.add('d-none');
    }
}
</script>
{% endblock %}
