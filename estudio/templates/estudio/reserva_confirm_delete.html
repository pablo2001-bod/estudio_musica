{% extends 'base.html' %}

{% block title %}Cancelar Reserva | Estudio{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 rounded-4 text-center p-4">
        <div class="card-body">
            <div class="text-danger mb-3">
                <svg width="64" height="64" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
                    <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.146.146 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.163.163 0 0 1-.054.06.116.116 0 0 1-.066.017H1.146a.115.115 0 0 1-.066-.017.163.163 0 0 1-.054-.06.176.176 0 0 1 .002-.183L7.884 2.073a.147.147 0 0 1 .054-.057zm1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566z"/>
                    <path d="M7.002 12a1 1 0 1 0 2 0 1 1 0 0 0-2 0zM7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995z"/>
                </svg>
            </div>
            <h4 class="fw-bold text-dark mb-2">¿Cancelar esta reserva?</h4>
            <p class="text-muted small">Esta acción no se puede deshacer. Se liberará la sala y los equipos asignados.</p>
            
            <form method="POST" class="mt-4">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger rounded-pill fw-bold py-2">
                        Sí, Cancelar Reserva
                    </button>
                    <a href="{% url 'index' %}" class="btn btn-light rounded-pill py-2">Volver al Grid</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
