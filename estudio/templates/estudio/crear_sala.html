{% extends 'base.html' %}
{% load static %}

{% block title %}Agregar Nueva Sala{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">Agregar Nueva Sala</h4>
                </div>

                <form method="POST" enctype="multipart/form-data" class="card-body p-4">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre de la Sala <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3" id="nombre" name="nombre" placeholder="Ej:Sala Rock" required>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-bold">Descripción</label>
                        <textarea class="form-control rounded-3" id="descripcion" name="descripcion" rows="3" placeholder="Detalla el tratamiento acústico, tamaño, amplificadores y mas."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="precio_hora" class="form-label fw-bold">Precio por Hora <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-3">$</span>
                            <input type="number" step="0.01" class="form-control rounded-end-3" id="precio_hora" name="precio_hora" placeholder="555.00" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="imagen" class="form-label fw-bold">Imagen de la Sala</label>
                        <input type="file" class="form-control rounded-3" id="imagen" name="imagen" accept="image/*" onchange="previewImagen(event)">
                        
                        <div class="mt-3 text-center d-none" id="preview-container">
                            <p class="small text-muted mb-1">Vista previa:</p>
                            <img id="img-preview" src="#" alt="Vista previa" class="img-fluid rounded-3 shadow-sm" style="max-height: 200px; object-fit: cover;">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold">
                            Guardar Sala
                        </button>
                        <a href="{% url 'salas' %}" class="btn btn-light rounded-pill text-muted">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Función para mostrar la vista previa de la imagen antes de subirla
function previewImagen(event) {
    const reader = new FileReader();
    const container = document.getElementById('preview-container');
    const preview = document.getElementById('img-preview');

    reader.onload = function() {
        preview.src = reader.result;
        container.classList.remove('d-none');
    }

    if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    } else {
        container.classList.add('d-none');
    }
}
</script>
{% endblock %}
